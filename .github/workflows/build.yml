name: Build DouyinAuthHook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git fakeroot dpkg-dev libxml2-dev libssl-dev zlib1g-dev curl

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/sdks
          cp -r /tmp/sdks/iPhoneOS15.5.sdk $THEOS/sdks/

      - name: Build
        run: |
          make clean package

      - name: Extract dylib from deb
        run: |
          mkdir -p output
          DEB=$(ls packages/*.deb | head -1)
          dpkg-deb -x "$DEB" extracted
          find extracted -name "*.dylib" -exec cp {} output/ \;
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DouyinAuthHook.dylib
          path: output/*.dylib

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DouyinAuthHook-deb
          path: packages/*.deb
          


