name: Build DouyinAuthHook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: brew install ldid

      - name: Build
        run: |
          make clean package

      - name: Extract dylib from deb
        run: |
          mkdir -p output
          DEB=$(ls packages/*.deb | head -1)
          dpkg-deb -x "$DEB" extracted
          find extracted -name "*.dylib" -exec cp {} output/ \;
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DouyinAuthHook.dylib
          path: output/*.dylib

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DouyinAuthHook-deb
          path: packages/*.deb
          

