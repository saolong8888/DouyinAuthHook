.github/workflows/build.ymlname: Build DouyinAuthHook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          xcrun --sdk iphoneos clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=14.0 \
            -fobjc-arc \
            -dynamiclib \
            -install_name @executable_path/DouyinAuthHook.dylib \
            -framework UIKit -framework Security -framework Foundation \
            -o DouyinAuthHook.dylib DouyinAuthHook.m
          echo "=== Build done ==="
          ls -la DouyinAuthHook.dylib
          echo "=== Dependencies ==="
          otool -L DouyinAuthHook.dylib
          echo "=== Install name ==="
          otool -D DouyinAuthHook.dylib

      - name: Copy dylib
        run: |
          mkdir -p output
          cp DouyinAuthHook.dylib output/
          ls -la output/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DouyinAuthHook.dylib
          path: output/*.dylib
          

